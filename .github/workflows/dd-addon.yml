name: Validate addon

on:
  pull_request:
  push:
    branches: [DD-Addon]
    tags: ["addon-v*"]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: node scripts/validate.js
      - run: sh -n docker/install.sh && sh -n docker/entrypoint.sh
      - run: node --check web/addon.js
      - name: Upgrade regression test (Beta.6 viewer -> pinned viewer, 401 without login, 200 with)
        run: sh scripts/test-upgrade.sh
      - name: Package
        run: bash scripts/package.sh
      - name: Tag matches addon version
        if: startsWith(github.ref, 'refs/tags/addon-v')
        run: |
          V="$(node -e "process.stdout.write(require('./addon.json').version)")"
          [ "addon-v$V" = "$GITHUB_REF_NAME" ] || { echo "addon.json version $V does not match tag $GITHUB_REF_NAME"; exit 1; }
      - name: Release
        if: startsWith(github.ref, 'refs/tags/addon-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ZIP="$(ls dist/*.zip)"
          # A release published by hand must not be replaced: its checksum is pinned in the catalog.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, leaving it untouched."; exit 0
          fi
          gh release create "$GITHUB_REF_NAME" "$ZIP" "$ZIP.sha256" \
            --title "MapViewer3D Addon ${GITHUB_REF_NAME#addon-v}" \
            --notes "Addon package and SHA-256 checksum." --repo "$GITHUB_REPOSITORY"
