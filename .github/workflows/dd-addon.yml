name: Validate addon

on:
  pull_request:
  push:
    branches: [DD-Addon]
    tags: ["addon-v*"]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: node scripts/validate.js
      - run: npm ci --no-audit --no-fund
      - name: Unit tests (API key never persisted, Realtime Data, share links, console cache, data pinning, package checks, layers, data path, sandbox SQL and live data)
        run: node tests/run-all.mjs
      - name: Pinned data release is reachable and matches the pinned catalog checksum
        run: |
          TAG="$(sed -n "s/^export const DATA_TAG = '\(.*\)';/\1/p" web/js/config.js)"
          SHA="$(sed -n "s/^export let CATALOG_SHA256 = '\(.*\)';/\1/p" web/js/config.js)"
          curl --fail --silent --location "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${TAG}/catalog.json" -o catalog.json
          [ "$(sha256sum catalog.json | cut -d' ' -f1)" = "$SHA" ] || { echo "catalog.json of $TAG does not match CATALOG_SHA256"; exit 1; }
          echo "data $TAG ok"
          git clone --quiet --depth 1 --branch "$TAG" "https://github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/data"
      - name: Console (pinned commit of Red-Blink/dune-awakening-selfhost-docker)
        run: |
          git init --quiet "$RUNNER_TEMP/console"
          git -C "$RUNNER_TEMP/console" fetch --quiet --depth 1 https://github.com/Red-Blink/dune-awakening-selfhost-docker.git "$(cat tests/e2e/console-ref.txt)"
          git -C "$RUNNER_TEMP/console" checkout --quiet FETCH_HEAD
      - name: Package (source and package checks run inside)
        run: bash scripts/package.sh "$RUNNER_TEMP/data" "$RUNNER_TEMP/console"
      - name: Verify the packaged ZIP itself
        run: bash scripts/verify-package.sh "$(ls dist/*.zip)"
      - name: End-to-end test in the real Console (sandbox, CSP, protected routes, rendering, terrain, live data, share dialog)
        run: |
          npx playwright install --with-deps chromium
          node tests/e2e/run.mjs --pkg dist/package --console "$RUNNER_TEMP/console"
      - name: Tag matches addon version
        if: startsWith(github.ref, 'refs/tags/addon-v')
        run: |
          V="$(node -e "process.stdout.write(require('./addon.json').version)")"
          [ "addon-v$V" = "$GITHUB_REF_NAME" ] || { echo "addon.json version $V does not match tag $GITHUB_REF_NAME"; exit 1; }
      - name: Release
        if: startsWith(github.ref, 'refs/tags/addon-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ZIP="$(ls dist/*.zip)"
          # A release published by hand must not be replaced: its checksum is pinned in the catalog.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, leaving it untouched."; exit 0
          fi
          gh release create "$GITHUB_REF_NAME" "$ZIP" "$ZIP.sha256" \
            --title "MapViewer3D Addon ${GITHUB_REF_NAME#addon-v}" \
            --notes "Addon package and SHA-256 checksum." --repo "$GITHUB_REPOSITORY"
      - name: Verify the published release asset
        if: startsWith(github.ref, 'refs/tags/addon-v')
        run: |
          V="$(node -e "process.stdout.write(require('./addon.json').version)")"
          bash scripts/verify-package.sh "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/mapviewer3d-$V.zip"
