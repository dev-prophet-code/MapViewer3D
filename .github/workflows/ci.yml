name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true # newest 1.26.x patch, so govulncheck sees a patched standard library
          cache-dependency-path: backend/go.sum
      - name: Vet
        working-directory: backend
        run: CGO_ENABLED=0 go vet ./cmd/mapviewer/... ./server/... ./secure/... ./zen/...
      - name: Test
        working-directory: backend
        run: CGO_ENABLED=0 go test ./secure/... ./server/... ./zen/...
      - name: Extraction tools (needs the C compiler for Oodle)
        working-directory: backend
        run: CGO_ENABLED=1 go vet ./assets/... && CGO_ENABLED=1 go test ./assets/...
      - name: Build (all release targets)
        working-directory: backend
        run: |
          for t in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            CGO_ENABLED=0 GOOS=${t%/*} GOARCH=${t#*/} go build -o /dev/null ./cmd/mapviewer
          done

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true # newest 1.26.x patch, so govulncheck sees a patched standard library
          cache-dependency-path: backend/go.sum
      - name: govulncheck
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          CGO_ENABLED=0 "$(go env GOPATH)/bin/govulncheck" ./cmd/mapviewer/... ./server/... ./secure/...
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
