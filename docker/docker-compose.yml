# MapViewer3D companion for Dune Docker Console.
# Start with:  sh install.sh   (or: docker compose up -d after creating config.json)
services:
  mapviewer3d:
    image: alpine:3.20
    container_name: mapviewer3d
    restart: unless-stopped
    # Host networking lets the viewer reach the console on its host address
    # (the installer detects it; it may be the LAN address, not 127.0.0.1).
    network_mode: host
    # Run as the installing user so the owner-only config.json stays readable.
    user: "${MV_UID:-1000}:${MV_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./app:/app:ro
      - ./config.json:/config/config.json:ro
      - ./entrypoint.sh:/entrypoint.sh:ro
    environment:
      MV_ADDR: "${MV_ADDR:-127.0.0.1:8795}"
      MV_ALLOW_OPEN: "${MV_ALLOW_OPEN:-}"
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
