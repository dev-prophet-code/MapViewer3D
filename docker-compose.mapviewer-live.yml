# MapViewer3D for a Dune Docker host.
#
#   mvagent  live sandworms, enemies, civilians, vehicles, storms (optionally
#            players), read from the game server processes. No login; listens
#            on 127.0.0.1:8796 of the host only. The Dune Docker Console is the
#            one door to it (API key scope "Realtime Data", GET /api/realtime/*).
#   mvtls    optional encrypted front door for the Console API (HTTPS, own
#            long-lived key, pinned by the viewer). Forwards to the unchanged
#            Console on 127.0.0.1:8088. Nobody else has to change anything.
#            Start it with:  --profile tls
#
#   cp .env.example .env
#   docker compose -f docker-compose.mapviewer-live.yml up -d --build
#
# See README.md and SECURITY.md.

name: mapviewer-live

services:
  mvagent:
    build:
      context: .
      target: agent
      args:
        MV_REF: ${MV_REF:-beta.15}
        MV_COMMIT: ${MV_COMMIT:-7e1a73044023da89d42c9ea3ab3dba133904e8c1}
    image: mapviewer-live/mvagent:${MV_REF:-beta.15}
    restart: unless-stopped
    # sees the game server processes of the Dune Docker containers
    pid: host
    # loopback of the host, where the Console (host networking) reaches it;
    # -addr refuses anything but a loopback address
    network_mode: host
    # reading /proc/<pid>/mem of another container's process
    cap_drop: [ALL]
    cap_add: [SYS_PTRACE, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
      # Dune Docker runs its game containers privileged with AppArmor
      # "unconfined"; the docker-default profile refuses to read such a peer
      # (kernel: apparmor="DENIED" operation="ptrace" peer="unconfined"), so the
      # agent needs "unconfined" too. Its other limits stay.
      - apparmor=${MV_AGENT_APPARMOR:-unconfined}
    read_only: true
    command:
      - -addr=127.0.0.1:${MV_AGENT_PORT:-8796}
      - -players=${MV_AGENT_PLAYERS:-false}
      - -hz=${MV_AGENT_HZ:-10}
    mem_limit: 512m
    cpus: ${MV_AGENT_CPUS:-1.0}
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  # Encrypted front door (optional, profile "tls"). Host networking: it reaches
  # the Console on the host's loopback and listens on MV_TLS_BIND:MV_TLS_PORT.
  mvtls:
    profiles: [tls]
    build:
      context: .
      target: tls
    image: mapviewer-live/mvtls:latest
    restart: unless-stopped
    network_mode: host
    environment:
      MV_TLS_ADDR: ${MV_TLS_BIND:-0.0.0.0}:${MV_TLS_PORT:-8797}
      MV_TLS_UPSTREAM: ${MV_TLS_UPSTREAM:-http://127.0.0.1:8088}
      MV_TLS_NAMES: ${MV_TLS_NAMES:-}
      MV_TLS_ALLOW: ${MV_TLS_ALLOW:-}
      MV_TLS_FULL: ${MV_TLS_FULL:-false}
    volumes:
      - mvtls-data:/data
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    mem_limit: 64m
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

volumes:
  # key and certificate of the encrypted front door: back it up, never share it
  mvtls-data: {}
