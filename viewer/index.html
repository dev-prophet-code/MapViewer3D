<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dune Map Viewer</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="icons.css">
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/build/three.module.js",
  "three/addons/": "./vendor/three/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="view"></canvas>

<aside id="panel">
  <div class="titlerow">
    <h1>Dune Map Viewer <span id="version" class="version"></span></h1>
    <label class="langsel"><span class="sr" data-i18n="language">Language</span>
      <select id="lang" title="Language / Sprache"></select>
    </label>
  </div>
  <div id="updateBox" class="updatebox" hidden></div>
  <label><span data-i18n="map">Map</span>
    <select id="map"></select>
  </label>
  <div id="mapinfo" class="muted pre small"></div>

  <section id="jump">
    <h2><span data-i18n="jump.title">Jump to</span> <span class="muted">(<span id="playerCount">0</span> online)</span></h2>
    <div id="playerList" class="plist"></div>
  </section>

  <section id="live">
    <h2 data-i18n="live.title">Live map</h2>
    <div class="btnrow layerbtns">
      <button id="layersAll" data-i18n="layers.all">Show all</button>
      <button id="layersNone" data-i18n="layers.none">Hide all</button>
    </div>
    <div id="liveStatus" class="muted pre small">–</div>
    <div id="liveToggles" class="toggles"></div>
    <h3 data-i18n="live.places">Locations, hazards &amp; resources</h3>
    <div id="liveCats" class="toggles"></div>
  </section>
  <div id="nolive" class="muted small" hidden data-i18n="live.none">The server provides no live data for this map.</div>

  <section id="conn">
    <h2 data-i18n="conn.title">Connection</h2>
    <div id="connInfo" class="muted small pre">–</div>
    <div class="btnrow">
      <button id="connSwitch" class="primary" data-i18n="conn.switch" data-i18n-title="conn.switch.tip">Switch server</button>
      <button id="connNames" data-i18n="conn.names" data-i18n-title="conn.names.tip">Name instances</button>
      <button id="connChange" data-i18n="conn.change" data-i18n-title="conn.change.tip">Change</button>
    </div>
    <button id="connDelete" class="danger" data-i18n="conn.delete" data-i18n-title="conn.delete.tip">Delete credentials</button>
  </section>

  <div id="cursor" class="mono muted">–</div>
  <button id="helpOpen" class="linkbtn" data-i18n="help.open">Camera controls &amp; guide</button>
</aside>

<div id="hud">
  <button id="panelToggle" class="hud-btn" aria-pressed="true" data-i18n-title="hud.panel" title="Show or hide the panel"><span class="ico ico-layers"></span></button>
  <button id="fsBtn" class="hud-btn" aria-pressed="false" data-i18n-title="hud.fullscreen" title="Fullscreen"><span class="ico ico-full"></span></button>
  <button id="helpBtn" class="hud-btn" data-i18n-title="help.title" title="Controls"><span class="ico">?</span></button>
  <a id="supportBtn" class="hud-btn" href="https://buymeacoffee.com/lafamiliagaming" target="_blank" rel="noopener noreferrer" data-i18n-title="support.tip" title="Support the project (Buy Me a Coffee)"><span class="ico" aria-hidden="true">☕</span></a>
  <div id="compass" class="compass"></div>
  <div class="theme-toggle" role="group" data-i18n-aria="theme.label" aria-label="Appearance">
    <button data-theme-set="light" data-i18n-title="theme.light" title="Light" aria-label="Light"><span aria-hidden="true">☀</span></button>
    <button data-theme-set="dark" data-i18n-title="theme.dark" title="Dark" aria-label="Dark"><span aria-hidden="true">☾</span></button>
  </div>
</div>

<div id="help" class="modal" hidden>
  <div class="dialog guide" role="dialog" aria-labelledby="helpTitle">
    <div class="li-head"><h1 id="helpTitle" data-i18n="help.title">Controls</h1><button id="helpClose" class="li-close" data-i18n-title="close">×</button></div>
    <div id="helpBody" data-i18n-html="help.body"></div>
  </div>
</div>

<div id="setup" class="modal" hidden>
  <form id="setupForm" class="dialog" autocomplete="off">
    <h1 data-i18n="setup.title">Connect to your Dune Docker server</h1>
    <p class="muted small" data-i18n="setup.intro"></p>
    <label><span data-i18n="setup.server">Server (host, IP or URL)</span>
      <input id="setupServer" type="text" data-i18n-ph="setup.server.ph" required spellcheck="false">
    </label>
    <label><span data-i18n="setup.port">Console port</span>
      <input id="setupPort" type="number" min="1" max="65535" value="8088">
    </label>
    <label><span data-i18n="setup.token">API token</span>
      <input id="setupToken" type="password" placeholder="dak_…" required spellcheck="false" autocomplete="new-password">
    </label>
    <label><span data-i18n="setup.pin">Certificate fingerprint (only for a self-signed or internal certificate)</span>
      <input id="setupPin" type="text" placeholder="sha256/…" spellcheck="false" autocomplete="off">
    </label>
    <div id="setupError" class="error small" hidden></div>
    <div class="btnrow">
      <button id="setupCancel" type="button" data-i18n="cancel">Cancel</button>
      <button id="setupSubmit" type="submit" class="primary" data-i18n="setup.connect">Connect</button>
    </div>
  </form>
</div>

<div id="secureOffer" class="modal" hidden>
  <div class="dialog" role="dialog" aria-labelledby="secureTitle">
    <h1 id="secureTitle" data-i18n="secure.title">Encrypted connection available</h1>
    <p class="muted small" data-i18n="secure.intro"></p>
    <label><span data-i18n="secure.address">Address</span>
      <input id="secureUrl" type="text" readonly spellcheck="false">
    </label>
    <label><span data-i18n="secure.fingerprint">Key fingerprint</span>
      <input id="securePin" type="text" readonly spellcheck="false" class="mono">
    </label>
    <p class="small" data-i18n-html="secure.compare"></p>
    <div id="secureError" class="error small" hidden></div>
    <div class="btnrow">
      <button id="secureNo" type="button" data-i18n="secure.no">Not now</button>
      <button id="secureYes" type="button" class="primary" data-i18n="secure.yes">The fingerprint matches – use it</button>
    </div>
  </div>
</div>

<div id="servers" class="modal" hidden>
  <div class="dialog" role="dialog" aria-labelledby="serversTitle">
    <h1 id="serversTitle" data-i18n="servers.title">Switch server</h1>
    <p class="muted small" data-i18n="servers.intro"></p>
    <ul id="serversList" class="servers"></ul>
    <div id="serversError" class="error small" hidden></div>
    <div class="btnrow">
      <button id="serversClose" type="button" data-i18n="close">Close</button>
      <button id="serversAdd" type="button" class="primary" data-i18n="servers.add">Add server …</button>
    </div>
  </div>
</div>

<div id="names" class="modal" hidden>
  <form id="namesForm" class="dialog">
    <h1 data-i18n="names.title">Name server instances</h1>
    <p class="muted small" data-i18n="names.intro"></p>
    <div id="namesList" class="names"></div>
    <div id="namesError" class="error small" hidden></div>
    <div class="btnrow">
      <button id="namesCancel" type="button" data-i18n="cancel">Cancel</button>
      <button type="submit" class="primary" data-i18n="save">Save</button>
    </div>
  </form>
</div>

<aside id="liveinfo" hidden>
  <div class="li-head"><span class="li-icon"></span><strong class="li-title"></strong><button class="li-close" data-i18n-title="close">×</button></div>
  <dl class="li-lines"></dl>
  <button class="li-jump" data-i18n="info.jump">Fly there</button>
</aside>

<script type="module" src="js/main.js"></script>
</body>
</html>
