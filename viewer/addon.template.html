<script>
// Brücke zur Console (aus dem Addon-Template; die Sandbox erlaubt keinen anderen Weg nach draußen)
(function () {
  const addonId = document.documentElement.dataset.addonId;
  const pending = new Map();
  function request(action, payload = {}) {
    if (window.parent === window) return Promise.reject(new Error('Nur in der Dune Docker Console verfügbar.'));
    const requestId = crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(16).slice(2);
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => { pending.delete(requestId); reject(new Error('Zeitüberschreitung der Brücke.')); }, 30000);
      pending.set(requestId, { resolve, reject, timer });
      try { window.parent.postMessage({ type: 'dune-addon-request', addonId, requestId, action, payload }, window.location.origin); }
      catch (e) { pending.delete(requestId); clearTimeout(timer); reject(e); }
    });
  }
  addEventListener('message', (ev) => {
    if (ev.source !== window.parent || ev.origin !== window.location.origin) return;
    const m = ev.data || {};
    if (m.type !== 'dune-addon-response' || typeof m.requestId !== 'string' || typeof m.ok !== 'boolean') return;
    if (m.addonId && m.addonId !== addonId) return;
    const p = pending.get(m.requestId); if (!p) return;
    pending.delete(m.requestId); clearTimeout(p.timer);
    m.ok ? p.resolve(m.result) : p.reject(new Error(m.error || 'Anfrage fehlgeschlagen.'));
  });
  window.DuneAddon = { request };
})();
</script>
