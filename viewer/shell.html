<canvas id="view"></canvas>

<aside id="panel">
  <div class="titlerow">
    <h1>Dune Map Viewer <span id="version" class="version">v__VERSION__</span></h1>
    <label class="langsel"><span class="sr" data-i18n="language">Language</span>
      <select id="lang" title="Language / Sprache"><option value="en">EN</option><option value="de">DE</option></select>
    </label>
  </div>
  <label><span data-i18n="map">Map</span>
    <select id="map"><option value="hagga">Hagga Basin</option><option value="deep">Deep Desert</option></select>
  </label>
  <div id="mapinfo" class="muted pre small"></div>

  <section id="jump">
    <h2><span data-i18n="jump.title">Jump to</span> <span class="muted">(<span id="playerCount">0</span> <span data-i18n="online">online</span>)</span></h2>
    <div id="playerList" class="plist"></div>
  </section>

  <section id="live">
    <h2 data-i18n="live.title">Live map</h2>
    <div class="btnrow layerbtns">
      <button id="layersAll" data-i18n="layers.all">Show all</button>
      <button id="layersNone" data-i18n="layers.none">Hide all</button>
    </div>
    <div id="liveStatus" class="muted pre small">–</div>
    <div id="layers" class="layers"></div>
  </section>

  <section id="conn">
    <h2 data-i18n="conn.title">Connection</h2>
    <div id="connInfo" class="muted small pre">–</div>
    <div class="btnrow" id="connButtons"></div>
  </section>

  <div id="cursor" class="mono muted">–</div>
  <button id="helpOpen" class="linkbtn" data-i18n="help.open">Camera controls &amp; guide</button>
</aside>

<div id="hudinfo"></div>
<div id="hud">
  <button id="panelToggle" class="hud-btn" aria-pressed="true" data-i18n-title="hud.panel" title="Show or hide the panel">☰</button>
  <button id="fsBtn" class="hud-btn" aria-pressed="false" data-i18n-title="hud.fullscreen" title="Fullscreen">⛶</button>
  <button id="helpBtn" class="hud-btn" data-i18n-title="help.title" title="Controls">?</button>
  <div class="theme-toggle" role="group" aria-label="Appearance">
    <button data-theme-set="light" title="Light" aria-label="Light">☀</button>
    <button data-theme-set="dark" title="Dark" aria-label="Dark">☾</button>
  </div>
</div>

<div id="help" class="modal" hidden>
  <div class="dialog guide" role="dialog" aria-labelledby="helpTitle">
    <div class="li-head"><h1 id="helpTitle" data-i18n="help.title">Controls</h1><button id="helpClose" class="li-close" type="button" data-i18n-title="close" title="Close">×</button></div>
    <div id="helpBody"></div>
  </div>
</div>

<div id="setup" class="modal" hidden>
  <form id="setupForm" class="dialog" autocomplete="off">
    <h1 id="setupTitle"></h1>
    <p id="setupIntro" class="muted small"></p>
    <div id="setupFields"></div>
    <div id="setupError" class="error small" hidden></div>
    <div class="btnrow">
      <button id="setupCancel" type="button" hidden></button>
      <button id="setupSubmit" type="submit" class="primary"></button>
    </div>
  </form>
</div>
